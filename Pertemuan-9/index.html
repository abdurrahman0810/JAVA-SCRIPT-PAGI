<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class List</title>
  </head>
  <body>
    <style>
      .class {
        width: 200px;
        height: 100px;
        background-color: red;
        margin-bottom: 20px;
      }
      .success {
        background-color: green;
      }
      .btn-remove {
        padding: 20px 10px;
        border-radius: 10px;
      }
      .box {
        background-color: aquamarine;
        width: 200px;
        height: 150px;
        margin: 10px;
        margin-bottom: 0;
      }
      .success {
        background-color: red !important;
        transition: 0.7s;
        margin-top: 200px;
      }

      #btn-add,
      #btn-remove {
        padding: 20px 10px;
        border-radius: 10px;
        transition: red;
      }
      #btn-add,
      #btn-remove:hover {
        color: green;
        background-color: #5678;
      }
    </style>
